<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    02 · Logo signature — the full `< MS />` lockup, on no ground at all.

    Real Space Grotesk outlines: brackets from Medium (500), initials from Bold
    (700), carrying the lockup's −0.045em tracking and 0.135 × cap gap. §02 asks
    for the mark as outlines rather than live text, which is also the only way a
    standalone SVG can be sure of the typeface.

    With the tile gone the mark sits directly on the browser's own chrome, so it
    ships both approved lockups and lets the tab pick: Ink + Blue 600 on light
    (§03's primary), White + Blue 400 on dark. Without this a white `MS` would
    vanish on a light tab strip.

    Note: §03 specifies the compact initials-only mark below 56px, so at 16px
    tab size this is deliberately outside the manual's guidance — kept this way
    on Moheb's explicit call, and measured before the call was made.

    The lockup is 4.15:1, so inside a square box it is width-bound: it already
    fills 96% of the width while the initials reach only 23% of the height, and
    no scaling can improve that. Swapping to the compact mark was tried and
    reverted; it stood the initials at 51% (2.2x the cap height on the tab) but
    lost the brackets, which is the trade that was declined. So don't reopen
    this as a sizing bug — the only lever is dropping the brackets.
  -->
  <style>
    .bracket { fill: #2563eb }
    .initials { fill: #0a1628 }
    @media (prefers-color-scheme: dark) {
      .bracket { fill: #60a5fa }
      .initials { fill: #ffffff }
    }
  </style>
  <g transform="translate(-1.176 58.161) scale(0.0318 -0.0318)">
    <path class="bracket" d="M100 291L100 409L520 570L520 474L194 357L194 343L520 226L520 130Z M2500 700L2596 700L2302 -200L2206 -200Z M3123 291L2703 130L2703 226L3029 343L3029 357L2703 474L2703 570L3123 409Z"/>
